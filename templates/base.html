<!doctype html>
<html lang="en">
  <head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      href="{{url_for('static',filename='css/styles.css')}}"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-md sticky-top d-flex">
      <div class="container-fluid">
        <span class="navbar-brand text-info">NOTRIKIS</span>
        <div>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse mr-auto"
            id="navbarSupportedContent"
          >
            <ul class="navbar-nav mr- auto">
              <li class="nav-item active">
                <a class="nav-link" href="/"
                  ><i class="bi bi-code-slash"></i> Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/aboutme"
                  ><i class="bi bi-code-slash"></i> About</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/projects"
                  ><i class="bi bi-code-slash"></i> Projects</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#certificates"
                  ><i class="bi bi-code-slash"></i> Certificates</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/faqs"
                  ><i class="bi bi-code-slash"></i> FAQs</a
                >
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    {% block content %}{% endblock %}
    <footer class="footer text-center py-3">
      <div class="container">
        <p>&copy; 2024 NOTRIKIS. All rights reserved.</p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>

    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script> -->
    <!-- <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script> -->
    <script src="{{url_for('static',filename='js/index.js')}}"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <title></title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"/>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
    <link
      href="{{url_for('static',filename='css/styles.css')}}"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-md sticky-top">
      <span class="navbar-brand text-success" href="#">NOTRIKIS</span>
      <button
        class="navbar-toggler bg-light"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
        style="background-color: wheat"
      >
        <span class="navbar-toggler-icon dark"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item active">
            <a class="nav-link" href="#"><i class="bi bi-code-slash"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-code-slash"></i> About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-code-slash"></i> Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-code-slash"></i> Certificates</a></i>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-code-slash"></i> Blogs</a>
          </li>
        </ul>
      </div>
    </nav>
    {% block content %}{% endblock %}
        <footer class="footer text-center py-3">
      <div class="container">
        <p>&copy; 2024 NOTRIKIS. All rights reserved.</p>
      </div>
    </footer>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script src="{{url_for('static',filename='js/index.js')}}"></script>
  </body>
</html>
